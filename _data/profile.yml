short_bio: >-
  <p>
    I am a Ph.D. student at the
    <strong>Key Laboratory of Transportation Big Data and Artificial Intelligence, Ministry of Education</strong>,
    School of Computer Science and Technology, <strong>Beijing Jiaotong University</strong>,
    advised by
    <a href="https://faculty.bjtu.edu.cn/7968/" target="_blank" rel="noopener noreferrer">Prof. Congyan Lang</a>.
  </p>
  <p>
    My research interests focus on <strong>3D Vision</strong> and
    <strong>Vision-Language Models</strong>, particularly
    <strong>3D Object Detection</strong> and <strong>3D Visual Grounding</strong>.
    I aim to develop multimodal approaches for understanding and reasoning about
    complex 3D environments.
  </p>

